name: CI — PR to dev

on:
  pull_request:
    branches: [dev]

jobs:
  lint-and-test:
    name: Lint + Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 backend/ --max-line-length=120 --exclude=backend/tests/

      - name: Run unit tests
        run: |
          pytest backend/tests/test_unit.py -v

      - name: Run integration tests
        run: |
          pytest backend/tests/test_integration.py -v

      - name: Run end-to-end tests
        run: |
          pytest backend/tests/test_e2e.py -v

  build-docker:
    name: Build Docker images (no push)
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t mlops-backend:pr-${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build -t mlops-frontend:pr-${{ github.sha }} ./frontend