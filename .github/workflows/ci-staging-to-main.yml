name: CI — staging to main

on:
  push:
    branches: [main]

jobs:
  verify-gate-and-promote:
    name: Verify quality gate + promote to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install mlflow

      - name: Verify gate + transition Staging -> Production
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/${{ secrets.DAGSHUB_USERNAME }}/${{ secrets.DAGSHUB_REPO_NAME }}.mlflow
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          SOURCE_STAGE: "Staging"
          TARGET_STAGE: "Production"
          R2_THRESHOLD: "0.7"
        run: python ml/promote.py

  retag-and-deploy:
    name: Retag validated images + deploy to production (no rebuild)
    runs-on: ubuntu-latest
    needs: verify-gate-and-promote
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Docker login
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Retag + push backend (staging -> latest)
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mlops-backend:staging
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/mlops-backend:staging ${{ secrets.DOCKERHUB_USERNAME }}/mlops-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mlops-backend:latest

      - name: Build + push frontend (production build with prod API URL)
        run: |
          docker build --build-arg VITE_API_URL=https://mlops-backend-production.onrender.com -t ${{ secrets.DOCKERHUB_USERNAME }}/mlops-frontend:latest ./frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mlops-frontend:latest

      - name: Trigger production deploy hook
        run: curl -X POST "${{ secrets.RENDER_PROD_DEPLOY_HOOK }}"