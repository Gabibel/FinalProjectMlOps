name: CI — dev to staging

on:
  push:
    branches: [staging]

jobs:
  test-and-train:
    name: Full test suite + train candidate
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install "dvc[http]"

      - name: Configure DVC remote auth
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user ${{ secrets.DAGSHUB_USERNAME }}
          dvc remote modify origin --local password ${{ secrets.DAGSHUB_TOKEN }}

      - name: DVC pull
        run: dvc pull

      - name: Run full test suite
        run: pytest backend/tests/ -v

      - name: Train candidate model
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/${{ secrets.DAGSHUB_USERNAME }}/${{ secrets.DAGSHUB_REPO_NAME }}.mlflow
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: python ml/train.py

      - name: Quality gate + register candidate to Staging
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/${{ secrets.DAGSHUB_USERNAME }}/${{ secrets.DAGSHUB_REPO_NAME }}.mlflow
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          SOURCE_STAGE: "None"
          TARGET_STAGE: "Staging"
          R2_THRESHOLD: "0.7"
        run: python ml/promote.py

  build-and-push:
    name: Build + push Docker images (:staging)
    runs-on: ubuntu-latest
    needs: test-and-train
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Docker login
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build + push backend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mlops-backend:staging ./backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mlops-backend:staging

      - name: Build + push frontend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mlops-frontend:staging ./frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mlops-frontend:staging

  deploy-staging:
    name: Deploy to staging environment
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging

    steps:
      - name: Trigger staging deploy hook
        run: curl -X POST "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}"